{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="h3 mb-3">{% if form.instance.pk %}Editar Turma{% else %}Nova Turma{% endif %}</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Salvar</button>
    <a href="{% url 'turma-list' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
