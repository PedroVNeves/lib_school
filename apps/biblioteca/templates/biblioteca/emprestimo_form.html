{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% block content %}
<h1 class="h3 mb-3">Novo Empréstimo</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-primary">Registrar Empréstimo</button>
    <a href="{% url 'emprestimo-list' %}" class="btn btn-outline-secondary">Cancelar</a>
</form>
{% endblock %}
