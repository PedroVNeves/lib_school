{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login — Biblioteca Escolar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm" style="max-width: 420px; width: 100%;">
        <div class="card-body p-4">
            <h1 class="h4 mb-3 text-center">📚 Biblioteca Escolar</h1>
            {% if form.errors %}
                <div class="alert alert-danger errorlist">E-mail ou senha inválidos.</div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label" for="id_username">E-mail</label>
                    <input type="email" name="username" class="form-control" id="id_username" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="id_password">Senha</label>
                    <input type="password" name="password" class="form-control" id="id_password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
            <div class="text-center mt-3">
                <a href="{% url 'password_reset' %}" class="small">Esqueci minha senha</a>
            </div>
        </div>
    </div>
</div>
<script>
document.addEventListener('submit', function (event) {
    var form = event.target;
    var btn = form.querySelector('button[type="submit"], button:not([type])');
    if (!btn || btn.disabled) return;
    btn.disabled = true;
    btn.dataset.originalHtml = btn.innerHTML;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span> Aguarde...';
});
</script>
</body>
</html>
