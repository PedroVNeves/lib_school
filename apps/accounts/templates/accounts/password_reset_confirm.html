{% extends 'base.html' %}
{% block content %}
<div class="col-md-6">
    <h2>Definir nova senha</h2>
    {% if validlink %}
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Salvar nova senha</button>
    </form>
    {% else %}
    <p>O link de redefinição é inválido ou já expirou.</p>
    {% endif %}
</div>
{% endblock %}
