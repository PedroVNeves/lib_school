{% extends 'base.html' %}
{% block content %}
<div class="col-md-6">
    <h2>Esqueci minha senha</h2>
    <p>Informe seu e-mail para receber o link de redefinição.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Enviar</button>
    </form>
</div>
{% endblock %}
